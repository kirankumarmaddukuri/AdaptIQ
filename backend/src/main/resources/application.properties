spring.application.name=adaptive-learning-backend
server.port=8080
spring.config.import=optional:file:.env[.properties]

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# Firebase Configuration
firebase.service-account.path=classpath:firebase-service-account.json
firebase.enabled=false

# Logging
logging.level.com.adaptivelearning=INFO
logging.level.org.springframework.web=INFO
